<div
  [class]="
    viewModel.isMapFullscreen()
      ? 'fixed inset-0 z-[1100] flex h-screen w-screen overflow-hidden bg-surface-0 dark:bg-surface-900'
      : 'flex h-[calc(100vh-8rem)] w-full flex-col overflow-hidden rounded-2xl border border-surface-200 bg-surface-0 shadow-sm md:flex-row dark:border-surface-800 dark:bg-surface-900 !mb-0'
  "
>
  <app-harvest-forecast-panel
    class="flex h-[48%] w-full shrink-0 flex-col border-b border-surface-200 md:h-full md:w-96 md:border-b-0 md:border-r lg:w-[25rem] xl:w-[26rem] dark:border-surface-800"
  />
  <div class="relative min-h-0 min-w-0 flex-1 overflow-hidden bg-surface-100 dark:bg-surface-950">
    <app-harvest-forecast-map />
  </div>
</div>

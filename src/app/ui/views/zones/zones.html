<div class="flex h-[calc(100vh-56px)] flex-col overflow-hidden bg-canvas text-ink">
  <!-- Horizontal Navigation Bar -->
  <header
    class="z-20 shrink-0 border-b border-border bg-surface px-4 pt-3 sm:px-5"
  >
    <div class="flex flex-col gap-2 lg:flex-row lg:items-end lg:justify-start">
      <!-- Segmented Control Horizontal Navigation -->
      <nav
        role="tablist"
        aria-label="Navegação de Zonas"
        class="flex max-w-full items-center gap-5 overflow-x-auto"
      >
        <button
          type="button"
          role="tab"
          id="tab-cadastro"
          aria-controls="panel-cadastro"
          [attr.aria-selected]="activeTab() === 'cadastro'"
          (click)="setActiveTab('cadastro')"
          class="zones-tab"
        >
          <svg
            class="h-4 w-4 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"
            />
          </svg>
          <span>Cadastro de Zonas</span>
        </button>

        <button
          type="button"
          role="tab"
          id="tab-atribuicao"
          aria-controls="panel-atribuicao"
          [attr.aria-selected]="activeTab() === 'atribuicao'"
          (click)="setActiveTab('atribuicao')"
          class="zones-tab"
        >
          <svg
            class="h-4 w-4 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
            />
          </svg>
          <span>Atribuição de Zonas</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Views Content Panels -->
  <main class="relative flex-1 min-h-0 overflow-hidden">
    <div
      id="panel-cadastro"
      role="tabpanel"
      aria-labelledby="tab-cadastro"
      class="h-full w-full"
      [class.hidden]="activeTab() !== 'cadastro'"
    >
      <app-zone-map-management #managementView class="block h-full w-full" />
    </div>

    <div
      id="panel-atribuicao"
      role="tabpanel"
      aria-labelledby="tab-atribuicao"
      class="h-full w-full"
      [class.hidden]="activeTab() !== 'atribuicao'"
    >
      <app-zone-assignment #assignmentView class="block h-full w-full" />
    </div>
  </main>
</div>

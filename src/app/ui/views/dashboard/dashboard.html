<div
  [class]="
    dashboardViewModel.isMapFullscreen()
      ? 'fixed top-14 inset-x-0 bottom-0 z-[100] flex overflow-hidden bg-canvas'
      : 'relative flex h-[calc(100vh-56px)] overflow-hidden bg-canvas'
  "
>
  <!-- Left Filter Sidebar -->
  <app-dashboard-filters-panel class="block h-full min-h-0" />

  <!-- Map Area -->
  <div class="min-w-0 flex-1 overflow-hidden">
    <app-dashboard-map />
  </div>
</div>

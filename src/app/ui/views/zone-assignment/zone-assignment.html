@let currentMessage = viewModel.messageService.currentMessage();

<div
  [class]="
    viewModel.isMapFullscreen()
      ? 'fixed inset-0 z-[1100] flex h-screen w-screen overflow-hidden bg-surface-0 dark:bg-surface-900'
      : 'h-[calc(100vh-8rem)] w-full overflow-hidden flex flex-col md:flex-row rounded-2xl border border-surface-200 dark:border-surface-800 shadow-sm bg-surface-0 dark:bg-surface-900 !mb-0'
  "
>
  @if (viewModel.messageService.showMessage() && currentMessage) {
    <div
      class="fixed left-3 right-3 top-[4.25rem] z-[1220] max-w-md shadow-lg backdrop-blur-md sm:left-auto sm:right-4 p-3 rounded-xl border text-sm font-medium"
      [ngClass]="{
        'bg-emerald-50 dark:bg-emerald-950/80 border-emerald-300 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200': currentMessage.type === 'warn',
        'bg-rose-50 dark:bg-rose-950/80 border-rose-300 dark:border-rose-800 text-rose-800 dark:text-rose-200': currentMessage.type === 'error',
        'bg-blue-50 dark:bg-blue-950/80 border-blue-300 dark:border-blue-800 text-blue-800 dark:text-blue-200': currentMessage.type === 'info'
      }"
      role="status"
    >
      {{ currentMessage.text }}
    </div>
  }

  <!-- Left Sidebar (Form) -->
  <aside class="w-full md:w-80 lg:w-[22rem] shrink-0 h-full flex flex-col border-b md:border-b-0 md:border-r border-surface-200 dark:border-surface-800 bg-surface-0 dark:bg-surface-900 overflow-hidden">
    <app-zone-assignment-form class="flex h-full min-h-0 flex-1 flex-col" />
  </aside>

  <!-- Map Area -->
  <div class="relative min-w-0 flex-1 h-full overflow-hidden bg-surface-100 dark:bg-surface-950">
    <app-map-polygon-selector
      class="absolute inset-0 w-full h-full"
      [center]="[-23.398772, -49.148646]"
      [zoom]="16"
      [locateUserOnInit]="true"
      [userLocationZoom]="18"
      [plants]="viewModel.allPlants()"
      [plantColor]="'#047857'"
      [plantFillColor]="'#10b981'"
      [backgroundPolygon]="viewModel.selectedZonePolygon()"
      [focusedPolygon]="viewModel.selectedZonePolygon()"
      [backgroundPolygonColor]="'#f97316'"
      [clearSignal]="viewModel.clearMapSignal()"
      [allowDrawingWithoutPlants]="true"
      (polygonSelected)="onPolygonSelected($event)"
      (polygonCleared)="onPolygonCleared()"
    />

    <!-- Fullscreen button floating over map -->
    <p-button
      type="button"
      (onClick)="toggleFullscreen()"
      [icon]="viewModel.isMapFullscreen() ? 'pi pi-window-minimize' : 'pi pi-window-maximize'"
      [rounded]="true"
      severity="secondary"
      styleClass="!absolute right-3 top-14 z-[400] shadow-md"
      [title]="viewModel.isMapFullscreen() ? 'Sair da tela cheia' : 'Tela cheia'"
      [attr.aria-label]="viewModel.isMapFullscreen() ? 'Sair da tela cheia' : 'Tela cheia'"
    />
  </div>
</div>

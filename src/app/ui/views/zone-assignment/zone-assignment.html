@let currentMessage = viewModel.messageService.currentMessage();

<div
  [class]="
    viewModel.isMapFullscreen()
      ? 'fixed top-14 inset-x-0 bottom-0 z-[100] flex h-[calc(100vh-56px)] w-full flex-col overflow-hidden bg-canvas md:flex-row'
      : 'flex h-full w-full flex-col overflow-hidden bg-canvas md:flex-row'
  "
>
  @if (viewModel.messageService.showMessage() && currentMessage) {
    <div
      class="ui-alert fixed left-3 right-3 top-[4.25rem] z-[1220] max-w-md shadow-ui-md backdrop-blur-md sm:left-auto sm:right-4"
      [attr.data-ui-status]="currentMessage.type === 'warn' ? 'warning' : currentMessage.type === 'error' ? 'danger' : currentMessage.type === 'info' ? 'info' : null"
      role="status"
    >
      {{ currentMessage.text }}
    </div>
  }

  <!-- Left Sidebar (Form) -->
  <aside class="ui-form-panel ui-form-panel--rail">
    <app-zone-assignment-form class="flex h-full min-h-0 flex-1 flex-col" />
  </aside>

  <!-- Map Area -->
  <div class="relative min-h-[250px] md:min-h-0 flex-1 overflow-hidden h-full">
    <app-map-polygon-selector
      class="absolute inset-0 w-full h-full"
      [center]="[-23.398772, -49.148646]"
      [zoom]="16"
      [locateUserOnInit]="true"
      [userLocationZoom]="18"
      [plants]="viewModel.allPlants()"
      [plantColor]="'#047857'"
      [plantFillColor]="'#10b981'"
      [backgroundPolygon]="viewModel.selectedZonePolygon()"
      [focusedPolygon]="viewModel.selectedZonePolygon()"
      [backgroundPolygonColor]="'#f97316'"
      [clearSignal]="viewModel.clearMapSignal()"
      [allowDrawingWithoutPlants]="true"
      (polygonSelected)="onPolygonSelected($event)"
      (polygonCleared)="onPolygonCleared()"
    />

    <!-- Fullscreen button floating over map -->
    <button
      type="button"
      (click)="toggleFullscreen()"
      class="ui-icon-button absolute right-3 top-14 z-[400]"
      [title]="viewModel.isMapFullscreen() ? 'Sair da tela cheia' : 'Tela cheia'"
      [attr.aria-label]="viewModel.isMapFullscreen() ? 'Sair da tela cheia' : 'Tela cheia'"
    >
      @if (viewModel.isMapFullscreen()) {
        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 11v-5h5M15 13v5h-5M4 20l5-5M20 4l-5 5"
          />
        </svg>
      } @else {
        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
          />
        </svg>
      }
    </button>
  </div>
</div>

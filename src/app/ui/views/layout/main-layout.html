<div class="min-h-screen bg-canvas font-sans text-ink transition-colors duration-[180ms]">
  <app-header
    [isNavigationOpen]="isMobileSidebarOpen()"
    (sidebarToggled)="toggleSidebar()"
  />

  <app-sidebar
    [isCollapsed]="isSidebarCollapsed()"
    [isMobileOpen]="isMobileSidebarOpen()"
    (navigationSelected)="closeMobileSidebar(true)"
  />

  <!-- Content Area -->
  <main
    class="pt-14 transition-[padding] duration-[180ms] ease-ui max-md:!pl-0"
    [ngClass]="isSidebarCollapsed() ? 'pl-16' : 'pl-56'"
  >
    <router-outlet />
  </main>
</div>

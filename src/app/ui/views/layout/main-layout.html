<div class="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 transition-colors">
  <app-header (sidebarToggled)="toggleSidebar()" />

  <app-sidebar [isCollapsed]="isSidebarCollapsed()" />

  <!-- Content Area -->
  <main
    class="transition-all duration-300 ease-in-out pt-[60px] max-md:!pl-0"
    [ngClass]="isSidebarCollapsed() ? 'pl-[64px]' : 'pl-[240px]'"
  >
    <router-outlet />
  </main>
</div>

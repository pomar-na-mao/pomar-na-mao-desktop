<section class="flex h-full min-h-0 w-full flex-col overflow-hidden rounded-xl border border-surface-200 bg-surface-0 shadow-sm dark:border-surface-700 dark:bg-surface-900">
  <form
    class="z-20 flex shrink-0 flex-wrap items-end gap-3 border-b border-surface-200 bg-surface-0 p-3 dark:border-surface-700 dark:bg-surface-900"
    [formGroup]="viewModel.coordinateForm"
    (ngSubmit)="viewModel.focusCoordinates()"
  >
    <div class="min-w-44 flex-1">
      <label for="property-latitude" class="mb-1 block text-sm font-medium">Latitude</label>
      <input
        id="property-latitude"
        pInputText
        type="number"
        step="any"
        formControlName="latitude"
        placeholder="-23.398772"
        class="w-full"
      />
    </div>

    <div class="min-w-44 flex-1">
      <label for="property-longitude" class="mb-1 block text-sm font-medium">Longitude</label>
      <input
        id="property-longitude"
        pInputText
        type="number"
        step="any"
        formControlName="longitude"
        placeholder="-49.148646"
        class="w-full"
      />
    </div>

    <p-button
      type="submit"
      icon="pi pi-search"
      label="Localizar"
      severity="secondary"
      aria-label="Localizar coordenadas"
    />

    <p-button
      type="button"
      icon="pi pi-save"
      label="Salvar demarcação"
      [loading]="viewModel.isSaving()"
      [disabled]="!viewModel.canSave()"
      (onClick)="viewModel.saveBoundary()"
      aria-label="Salvar demarcação"
    />

    @if (viewModel.coordinateError()) {
      <p class="w-full text-sm text-red-600" role="alert">
        {{ viewModel.coordinateError() }}
      </p>
    }
  </form>

  <div class="relative min-h-0 flex-1">
    @if (viewModel.isLoading()) {
      <div class="absolute inset-0 z-[1100] grid place-items-center bg-surface-0/70 dark:bg-surface-900/70">
        <span class="text-sm font-medium">Carregando demarcação...</span>
      </div>
    }

    <app-map-polygon-selector
      [center]="viewModel.mapCenter()"
      [zoom]="viewModel.mapZoom()"
      [plants]="[]"
      [allowDrawingWithoutPlants]="true"
      [maxPolygons]="1"
      [backgroundPolygon]="viewModel.persistedBoundary()"
      [focusedPolygon]="viewModel.persistedBoundary()"
      [backgroundPolygonColor]="'#ffffff'"
      [backgroundPolygonDashArray]="'4, 4'"
      [backgroundPolygonFillOpacity]="0"
      [clearSignal]="viewModel.clearMapSignal()"
      (polygonSelected)="viewModel.onPolygonSelected($event.coordinates)"
      (polygonCleared)="viewModel.onPolygonCleared()"
    />
  </div>
</section>

<div class="max-w-6xl space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
  <div>
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white transition-colors">Sincronizações</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-1 transition-colors">
      Gerencie e acompanhe o status das sincronizações de campo.
    </p>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden transition-colors">
    <!-- Tabs Header -->
    <div class="flex border-b border-slate-100 dark:border-slate-800 overflow-x-auto bg-slate-50/50 dark:bg-slate-800/50">
      @for (tab of tabs; track tab.id) {
        <button
          (click)="setActiveTab(tab.id)"
          [ngClass]="
            activeTab === tab.id
              ? 'text-emerald-600 dark:text-emerald-400 border-emerald-600 dark:border-emerald-500 bg-white dark:bg-slate-900'
              : 'text-slate-500 dark:text-slate-400 border-transparent hover:text-slate-700 dark:hover:text-slate-200'
          "
          class="px-6 py-4 text-sm font-semibold border-b-2 transition-all whitespace-nowrap focus:outline-none"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    <!-- Tab Content -->
    <div class="p-6">
      @if (activeTab === 'annotations') {
        <div class="animate-in fade-in duration-300">
          <app-annotations-table />
        </div>
      }

      @if (activeTab === 'new-plants') {
        <div class="animate-in fade-in duration-300">
          <app-new-plants-table />
        </div>
      }

      @if (activeTab === 'routines') {
        <div class="animate-in fade-in duration-300">
          <app-routines-table />
        </div>
      }
    </div>
  </div>
</div>

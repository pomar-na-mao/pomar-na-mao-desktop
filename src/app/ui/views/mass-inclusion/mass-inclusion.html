@let currentMessage = massInclusionViewModel.messageService.currentMessage();

<div class="p-6 lg:p-8 flex flex-col h-full space-y-6 overflow-hidden">
  @if (massInclusionViewModel.messageService.showMessage() && currentMessage) {
  <div
    class="fixed right-6 top-20 z-[1200] max-w-md rounded-lg border px-4 py-3 text-sm font-semibold shadow-xl backdrop-blur-md transition-colors"
    [ngClass]="{
      'border-emerald-200 bg-emerald-50/95 text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-500/15 dark:text-emerald-300': currentMessage.type === 'success',
      'border-red-200 bg-red-50/95 text-red-700 dark:border-red-500/30 dark:bg-red-500/15 dark:text-red-300': currentMessage.type === 'error',
      'border-amber-200 bg-amber-50/95 text-amber-700 dark:border-amber-500/30 dark:bg-amber-500/15 dark:text-amber-300': currentMessage.type === 'warn',
      'border-blue-200 bg-blue-50/95 text-blue-700 dark:border-blue-500/30 dark:bg-blue-500/15 dark:text-blue-300': currentMessage.type === 'info'
    }"
  >
    {{ currentMessage.text }}
  </div>
  }

  <div
    class="flex-1 flex flex-col lg:flex-row gap-6 min-h-0 animate-in fade-in slide-in-from-bottom-4 duration-700"
  >
    <!-- Sidebar / Form -->
    <div
      class="order-2 w-full lg:order-1 lg:w-[450px] lg:shrink-0 flex flex-col min-h-0"
    >
      <app-mass-inclusion-form class="block h-full"></app-mass-inclusion-form>
    </div>

    <!-- Main Content / Map -->
    <div class="order-1 flex-1 flex flex-col gap-4 min-h-0">
      <div class="flex-shrink-0">
        <app-mass-inclusion-map-filters />
      </div>

      <div
        class="flex-1 relative rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-sm bg-white dark:bg-slate-900 min-h-0 transition-colors"
      >
        <app-map-polygon-selector
          class="absolute inset-0 w-full h-full"
          [center]="[-23.398772, -49.148646]"
          [zoom]="16"
          [backgroundPolygon]="massInclusionViewModel.backgroundPolygon()"
          [plants]="massInclusionViewModel.plants()"
          [clearSignal]="massInclusionViewModel.clearMapSignal()"
          (polygonSelected)="onPolygonSelected($event)"
          (polygonCleared)="onPolygonCleared()"
        />
      </div>
    </div>
  </div>
</div>

@let currentMessage = massInclusionViewModel.messageService.currentMessage();

<div
  [class]="
    massInclusionViewModel.isMapFullscreen()
      ? 'fixed top-14 inset-x-0 bottom-0 z-[100] flex h-[calc(100vh-56px)] w-full flex-col overflow-hidden bg-canvas md:flex-row'
      : 'flex h-[calc(100vh-56px)] w-full flex-col overflow-hidden bg-canvas md:flex-row'
  "
>
  @if (massInclusionViewModel.messageService.showMessage() && currentMessage) {
  <div
    class="ui-alert fixed left-3 right-3 top-[4.25rem] z-[1220] max-w-md shadow-ui-md backdrop-blur-md sm:left-auto sm:right-4"
    [attr.data-ui-status]="currentMessage.type === 'warn' ? 'warning' : currentMessage.type === 'error' ? 'danger' : currentMessage.type === 'info' ? 'info' : null"
    role="status"
  >
    {{ currentMessage.text }}
  </div>
  }

  <!-- Left Sidebar (Form) -->
  <aside class="ui-form-panel ui-form-panel--rail">
    <app-mass-inclusion-form class="flex h-full min-h-0 flex-1 flex-col" />
  </aside>

  <!-- Map Area -->
  <div class="relative h-full min-h-[250px] flex-1 overflow-hidden md:min-h-0">
    <app-map-polygon-selector
      class="absolute inset-0 w-full h-full"
      [center]="[-23.398772, -49.148646]"
      [zoom]="16"
      [backgroundPolygons]="massInclusionViewModel.backgroundPolygons()"
      [focusedPolygon]="massInclusionViewModel.focusedBackgroundPolygon()"
      [backgroundPolygonColors]="massInclusionViewModel.backgroundPolygonColors()"
      [backgroundPolygonDashArrays]="massInclusionViewModel.backgroundPolygonDashArrays()"
      [plants]="[]"
      [allowDrawingWithoutPlants]="true"
      [clearSignal]="massInclusionViewModel.clearMapSignal()"
      (polygonSelected)="onPolygonSelected($event)"
      (polygonCleared)="onPolygonCleared()"
    />

    <!-- Fullscreen button floating over map (below toolbar) -->
    <button
      (click)="toggleFullscreen()"
      class="ui-icon-button absolute right-3 top-14 z-[400]"
      [attr.aria-label]="massInclusionViewModel.isMapFullscreen() ? 'Sair da tela cheia' : 'Tela cheia'"
      [title]="
        massInclusionViewModel.isMapFullscreen()
          ? 'Sair da tela cheia'
          : 'Tela cheia'
      "
    >
      @if (massInclusionViewModel.isMapFullscreen()) {
        <svg
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 11v-5h5M15 13v5h-5M4 20l5-5M20 4l-5 5"
          />
        </svg>
      } @else {
        <svg
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
          />
        </svg>
      }
    </button>
  </div>
</div>

@let currentMessage = massInclusionViewModel.messageService.currentMessage();

<div
  [class]="
    massInclusionViewModel.isMapFullscreen()
      ? 'fixed top-[60px] inset-x-0 bottom-0 z-[100] flex overflow-hidden bg-white dark:bg-slate-950'
      : 'flex h-[calc(100vh-64px)] overflow-hidden'
  "
>
  @if (massInclusionViewModel.messageService.showMessage() && currentMessage) {
  <div
    class="fixed right-6 top-20 z-[1200] max-w-md rounded-lg border px-4 py-3 text-sm font-semibold shadow-xl backdrop-blur-md transition-colors"
    [ngClass]="{
      'border-emerald-200 bg-emerald-50/95 text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-500/15 dark:text-emerald-300': currentMessage.type === 'success',
      'border-red-200 bg-red-50/95 text-red-700 dark:border-red-500/30 dark:bg-red-500/15 dark:text-red-300': currentMessage.type === 'error',
      'border-amber-200 bg-amber-50/95 text-amber-700 dark:border-amber-500/30 dark:bg-amber-500/15 dark:text-amber-300': currentMessage.type === 'warn',
      'border-blue-200 bg-blue-50/95 text-blue-700 dark:border-blue-500/30 dark:bg-blue-500/15 dark:text-blue-300': currentMessage.type === 'info'
    }"
  >
    {{ currentMessage.text }}
  </div>
  }

  <!-- Left Sidebar (Form) -->
  <aside
    class="flex h-full w-[380px] shrink-0 flex-col border-r border-slate-200 bg-slate-50/80 dark:border-slate-800 dark:bg-slate-950/60"
  >
    <app-mass-inclusion-form class="block h-full" />
  </aside>

  <!-- Map Area -->
  <div class="flex-1 relative overflow-hidden h-full">
    <app-map-polygon-selector
      class="absolute inset-0 w-full h-full"
      [center]="[-23.398772, -49.148646]"
      [zoom]="16"
      [backgroundPolygon]="massInclusionViewModel.backgroundPolygon()"
      [plants]="massInclusionViewModel.plants()"
      [clearSignal]="massInclusionViewModel.clearMapSignal()"
      (polygonSelected)="onPolygonSelected($event)"
      (polygonCleared)="onPolygonCleared()"
    />

    <!-- Fullscreen button floating over map (below toolbar) -->
    <button
      (click)="toggleFullscreen()"
      class="absolute right-3 top-14 z-[400] rounded-lg bg-white/90 p-2 text-slate-600 shadow-md backdrop-blur-sm transition-colors hover:bg-white hover:text-slate-900 focus:outline-none dark:bg-slate-800/90 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
      [title]="
        massInclusionViewModel.isMapFullscreen()
          ? 'Sair da tela cheia'
          : 'Tela cheia'
      "
    >
      @if (massInclusionViewModel.isMapFullscreen()) {
        <svg
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 11v-5h5M15 13v5h-5M4 20l5-5M20 4l-5 5"
          />
        </svg>
      } @else {
        <svg
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
          />
        </svg>
      }
    </button>
  </div>
</div>

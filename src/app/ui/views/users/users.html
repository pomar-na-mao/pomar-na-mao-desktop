<div class="h-[calc(100vh-8rem)] w-full overflow-hidden flex flex-col rounded-2xl border border-surface-200 dark:border-surface-800 shadow-sm bg-surface-0 dark:bg-surface-900 !mb-0">
  <!-- Toolbar -->
  <div class="shrink-0 flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-4 py-2 border-b border-surface-200 dark:border-surface-800 bg-surface-50/50 dark:bg-surface-800/20">
    <div class="flex items-center gap-4">
      <div class="">
        <h4 class="font-bold text-surface-900 dark:text-surface-0 leading-none">Usuários</h4>
        <p class="text-[10px] text-surface-500 dark:text-surface-400 leading-none">Gerenciamento de acessos da equipe</p>
      </div>

      <div class="w-full sm:w-72">
        <p-iconfield class="w-full">
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            type="text"
            (input)="onGlobalFilter(dt, $event)"
            placeholder="Buscar por nome, e-mail, cargo..."
            class="w-full p-inputtext-sm"
          />
        </p-iconfield>
      </div>
    </div>

    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
      <p-button
        label="Exportar CSV"
        icon="pi pi-download"
        severity="secondary"
        size="small"
        [outlined]="true"
        (onClick)="exportCSV(dt)"
      />
      <p-button
        label="Convidar Usuário"
        icon="pi pi-user-plus"
        severity="primary"
        size="small"
      />
    </div>
  </div>

  <!-- PrimeNG Table (Scrollable Container) -->
  <div class="flex-1 min-h-0 overflow-y-auto">
    <p-table
      #dt
      [value]="users"
      [(selection)]="selectedUsers"
      dataKey="id"
      [rows]="10"
      [paginator]="true"
      [rowsPerPageOptions]="[5, 10, 20]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} usuários"
      [globalFilterFields]="['name', 'email', 'role', 'status']"
      [rowHover]="true"
      responsiveLayout="stack"
      styleClass="p-datatable-sm"
    >
      <ng-template #header>
        <tr class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 bg-surface-50 dark:bg-surface-800/50">
          <th style="width: 3rem">
            <p-tableHeaderCheckbox />
          </th>
          <th pSortableColumn="name" style="min-width: 14rem">
            <div class="flex items-center gap-2">
              Usuário
              <p-sortIcon field="name" />
            </div>
          </th>
          <th pSortableColumn="role" style="min-width: 9rem">
            <div class="flex items-center gap-2">
              Cargo
              <p-sortIcon field="role" />
            </div>
          </th>
          <th pSortableColumn="status" style="min-width: 8rem">
            <div class="flex items-center gap-2">
              Status
              <p-sortIcon field="status" />
            </div>
          </th>
          <th style="width: 6rem; text-align: right">
            Ações
          </th>
        </tr>
      </ng-template>

      <ng-template #body let-user>
        <tr class="transition-colors hover:bg-surface-50 dark:hover:bg-surface-800/40">
          <td>
            <p-tableCheckbox [value]="user" />
          </td>
          <td>
            <div class="flex items-center gap-3">
              <p-avatar
                [image]="user.avatar"
                shape="circle"
                size="large"
                styleClass="shrink-0 border border-surface-200 dark:border-surface-700"
              />
              <div class="min-w-0">
                <p class="text-sm font-semibold text-surface-900 dark:text-surface-0 leading-tight">
                  {{ user.name }}
                </p>
                <p class="text-xs text-surface-500 dark:text-surface-400 truncate">
                  {{ user.email }}
                </p>
              </div>
            </div>
          </td>
          <td>
            <p-tag
              [value]="user.role"
              [severity]="getRoleSeverity(user.role)"
              [rounded]="true"
            />
          </td>
          <td>
            <p-tag
              [value]="user.status"
              [severity]="getStatusSeverity(user.status)"
              [rounded]="true"
            />
          </td>
          <td style="text-align: right">
            <div class="flex items-center justify-end gap-1">
              <p-button
                icon="pi pi-pencil"
                [text]="true"
                [rounded]="true"
                severity="info"
                size="small"
                pTooltip="Editar usuário"
                tooltipPosition="top"
                ariaLabel="Editar usuário"
              />
              <p-button
                icon="pi pi-trash"
                [text]="true"
                [rounded]="true"
                severity="danger"
                size="small"
                pTooltip="Excluir usuário"
                tooltipPosition="top"
                ariaLabel="Excluir usuário"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="text-center py-8 text-surface-500 dark:text-surface-400 text-sm">
            <div class="flex flex-col items-center justify-center gap-2">
              <i class="pi pi-users text-3xl text-surface-400"></i>
              <span>Nenhum usuário encontrado.</span>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

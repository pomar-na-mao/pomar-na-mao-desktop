<div class="space-y-4 p-4 sm:p-6 lg:p-7">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-page font-bold text-ink">Usuários</h1>
      <p class="mt-1 text-body text-ink-muted">Gerencie os membros da sua equipe e suas permissões.</p>
    </div>
    <button
      appButton variant="primary"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
        />
      </svg>
      Convidar Usuário
    </button>
  </div>

  <div class="ui-card overflow-hidden">
    <!-- Header/Search -->
    <div
      class="flex flex-col justify-between gap-3 border-b border-border bg-surface-muted p-3 sm:flex-row"
    >
      <div class="min-w-0 flex-1">
        <app-input
          placeholder="Buscar usuários..."
          icon="<svg xmlns='http://www.w3.org/2000/svg' class='h-5 w-5' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z' /></svg>"
        ></app-input>
      </div>
      <div class="flex gap-2">
        <button
          appButton variant="secondary" size="sm"
        >
          Exportar CSV
        </button>
        <button
          appButton variant="secondary" size="sm"
        >
          Filtros Avançados
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="users-table w-full border-collapse text-left">
        <thead>
          <tr class="border-b border-border bg-surface">
            <th class="px-4 py-3 text-caption font-bold uppercase tracking-wider text-ink-subtle">
              Usuário
            </th>
            <th class="px-4 py-3 text-caption font-bold uppercase tracking-wider text-ink-subtle">
              Cargo
            </th>
            <th class="px-4 py-3 text-caption font-bold uppercase tracking-wider text-ink-subtle">
              Status
            </th>
            <th
              class="px-4 py-3 text-right text-caption font-bold uppercase tracking-wider text-ink-subtle"
            >
              Gerenciar
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border">
          @for (user of users; track user) {
            <tr class="ui-table-row">
              <td class="px-4 py-3" data-label="Usuário">
                <div class="flex items-center gap-3">
                  <img
                    [src]="user.avatar"
                    class="h-10 w-10 rounded-full border border-border"
                    [alt]="user.name"
                  />
                  <div>
                    <p class="text-body font-bold text-ink">{{ user.name }}</p>
                    <p class="text-label text-ink-muted">{{ user.email }}</p>
                  </div>
                </div>
              </td>
              <td class="px-4 py-3" data-label="Cargo">
                <span
                  class="ui-badge"
                  [attr.data-ui-status]="getRoleStatus(user.role)"
                >
                  {{ user.role }}
                </span>
              </td>
              <td class="px-4 py-3" data-label="Status">
                <div class="flex items-center gap-1.5">
                  <span
                    class="ui-status-dot"
                    [attr.data-ui-status]="getStatusTone(user.status)"
                  ></span>
                  <span class="text-body font-medium text-ink-muted">{{ user.status }}</span>
                </div>
              </td>
              <td class="px-4 py-3 text-right" data-label="Gerenciar">
                <div class="flex justify-end gap-2">
                  <button
                    title="Editar"
                    class="ui-icon-button min-h-9 min-w-9 border-transparent text-info shadow-none"
                    aria-label="Editar usuário"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-4 w-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                      />
                    </svg>
                  </button>
                  <button
                    title="Excluir"
                    class="ui-icon-button min-h-9 min-w-9 border-transparent text-danger shadow-none"
                    aria-label="Excluir usuário"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-4 w-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                      />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

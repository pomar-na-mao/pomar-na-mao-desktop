<div class="w-full">
  <div class="w-full lg:w-[40%]">
    <app-select
      id="mass-inclusion-zone-select"
      label="Zona"
      [placeholder]="massInclusionViewModel.zoneOptions().length === 0 ? 'Nenhuma zona disponivel' : 'Selecione uma zona'"
      [value]="massInclusionViewModel.selectedZoneId()"
      [options]="massInclusionViewModel.zoneOptions()"
      [disabled]="massInclusionViewModel.isLoadingZones() || massInclusionViewModel.zoneOptions().length === 0"
      (valueChange)="massInclusionViewModel.onZoneChange($event)"
    />
  </div>
</div>

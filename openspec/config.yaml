schema: spec-driven

context: |
  - Sempre que importar componentes nos arquivos HTML, use a abreviação (self-closing tags). Exemplo: <app-meu-componente /> ao invés de <app-meu-componente></app-meu-componente>.
  - Sempre que criar RPC, alterar RPC, criar tabela ou editar tabela do Supabase, edite no arquivo database.md (Arquivo de arquitetura do banco de dados).
  - Sempre crie testes unitários para o que for implementado.
  - Use o MCP do Supabase para fazer as alterações necessárias no banco de dados.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - When a change creates or edits any Supabase table, RPC, function, trigger, policy, or permission, it must include updates to database.md and describe the implementation details that changed.
  design:
    - When a design affects any Supabase table, RPC, function, trigger, policy, or permission, document the database contract, migration impact, implementation details, and database.md updates.
  tasks:
    - Add an explicit documentation task for every Supabase table, RPC, function, trigger, policy, or permission change; update database.md and the relevant implementation details.
    - Sempre criar tarefas explícitas para os testes unitários do que for implementado.
